# ══════════════════════════════════════════════════════════════════════
#  Jenan BIZ — Render.com Blueprint
#  Deploy:  https://dashboard.render.com/select-repo?type=blueprint
#  ──────────────────────────────────────────────────────────────────
#  Services:
#    1. jenanbiz-api    — FastAPI backend (Web Service)
#    2. jenanbiz-worker — ARQ background worker (Worker)
#    3. jenanbiz-web    — Vue SPA (Static Site)
#    4. jenanbiz-cache  — Redis (Key-Value)
#  Database: jenanbiz-db (PostgreSQL, free tier)
# ══════════════════════════════════════════════════════════════════════

services:

  # ── 1. FastAPI Backend ──────────────────────────────────────────
  - type: web
    name: jenanbiz-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jenanbiz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: jenanbiz-cache
          type: redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "WARNING"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://jenanbiz-web.onrender.com"
      - key: MAX_FILE_SIZE_MB
        value: "15"
      - key: UPLOAD_DIR
        value: "/tmp/uploads"
      - key: OPENAI_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        value: ""
      - key: WHATSAPP_ENABLED
        value: "false"

  # ── 2. ARQ Background Worker ────────────────────────────────────
  - type: worker
    name: jenanbiz-worker
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m arq app.worker.WorkerSettings
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jenanbiz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: jenanbiz-cache
          type: redis
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: UPLOAD_DIR
        value: "/tmp/uploads"
      - key: OPENAI_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        value: ""

  # ── 3. Vue SPA (Static Site) ────────────────────────────────────
  - type: web
    name: jenanbiz-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Points to the backend API — must match the api service name above
      - key: VITE_API_URL
        value: "https://jenanbiz-api.onrender.com/api"

  # ── 4. Redis ────────────────────────────────────────────────────
  - type: redis
    name: jenanbiz-cache
    plan: free
    maxmemoryPolicy: noeviction

# ── PostgreSQL Database ──────────────────────────────────────────
databases:
  - name: jenanbiz-db
    plan: free
    databaseName: jenanbiz
    user: jenanbiz
