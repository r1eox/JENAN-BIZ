<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>جنان بز</title>
  <script>
    // GitHub Pages SPA redirect hack
    // Converts 404 paths back to hash params so Vue Router can handle them
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + 1).join('/') +
      '/?p=' + encodeURIComponent(l.pathname.slice(1) + (l.search ? l.search : '')) +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
